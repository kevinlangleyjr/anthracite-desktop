# hyprlock — Slatewave Space
# Colours are the Slatewave tokens from ~/.config/ags/style/_palette.scss:
#   bg #1a1e26  surface #2c313a  fg #e2e8f0  muted #94a3b8  line #475569
#   teal #5eead4  sky #38bdf8  rose #fb7185
# Launched by hypridle's lock_cmd, by loginctl lock-session, and by SUPER+L.

$font = JetBrainsMono Nerd Font
$teal = rgba(5eead4ee)
$sky = rgba(38bdf8ee)
$rose = rgba(fb7185ee)
$fg = rgb(226, 232, 240)
$muted = rgb(148, 163, 184)

general {
    hide_cursor = true
    # Fail closed: if a widget errors, still refuse to unlock.
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = slate, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, slate
    animation = fadeOut, 1, 4, slate
    animation = inputFieldDots, 1, 2, slate
}

background {
    monitor =
    # The desktop wallpaper rather than `screenshot`, so a lock never puts the
    # contents of your session on screen in the first place.
    path = ~/.config/ags/assets/slatewave-space.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.5
    contrast = 0.9
    vibrancy = 0.17
}

# TIME
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font

    position = 0, 210
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $muted
    font_size = 20
    font_family = $font

    position = 0, 130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12 # matches decoration:rounding in hyprland.lua

    inner_color = rgba(2c313acc)
    font_color = $fg
    outer_color = $teal $sky 45deg # same gradient as the active window border
    check_color = $sky $teal 45deg
    fail_color = $rose

    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false

    font_family = $font
    placeholder_text = <span foreground="##94a3b8">Enter password</span>
    fail_text = <span foreground="##fb7185">$FAIL ($ATTEMPTS)</span>
    check_text = Authenticating...

    position = 0, 0
    halign = center
    valign = center
}

# WHO IS LOGGED IN
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(uname -n)"
    color = $muted
    font_size = 14
    font_family = $font

    position = 0, -70
    halign = center
    valign = center
}

# BATTERY — a locked laptop is usually one you walked away from
label {
    monitor =
    text = cmd[update:30000] printf "%s%%  %s" "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)" "$(cat /sys/class/power_supply/BAT0/status 2>/dev/null)"
    color = $muted
    font_size = 13
    font_family = $font

    position = -30, -25
    halign = right
    valign = top
}
