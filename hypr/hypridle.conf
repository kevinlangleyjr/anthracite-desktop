# hypridle — idle ladder for the laptop panel.
#
#   4:00  dim the backlight (a warning shot; any input restores it)
#   8:00  lock
#   8:30  display off
#  20:00  suspend
#
# Each step is far enough from the last that you get a visible warning before
# anything disruptive happens. Started from hyprland.lua's autostart.

general {
    # pidof guard: loginctl lock-session and SUPER+L can both fire while a lock
    # is already up, and a second instance would stack on the first.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Wake the panel on resume so you get the lock screen without hunting for a key.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Dim, don't blank. -s saves the current level so -r restores exactly it.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 480
    on-timeout = loginctl lock-session
}

# Screen off shortly after the lock, so the lock is what you come back to.
listener {
    timeout = 510
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
