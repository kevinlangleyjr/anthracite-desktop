# Wallpaper.
#
# The Big Sur dark wallpaper from vinceliuice/WhiteSur-wallpapers (MIT), which
# is where the GTK theme comes from too — so the desktop and its backdrop are
# the same source rather than a rendered approximation.
#
# It is 16:9 and the panel is 16:10, so `cover` crops top and bottom rather
# than letterboxing. The composition is diagonal, which survives that crop.

preload = ~/.config/hypr/wallpapers/whitesur-dark.jpg

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/whitesur-dark.jpg
    fit_mode = cover
}
