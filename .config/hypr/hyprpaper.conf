# Desktop wallpaper. Lives in the repo next to this config so it travels
# with the dotfiles rather than sitting in ~/Downloads.
#
# hyprpaper 0.8 replaced the old `preload = path` / `wallpaper = mon,path`
# pair with this block. The old keys parse without complaint but register
# nothing, so hyprpaper starts, finds the output, logs "Monitor <name> has no
# target: no wp will be created" and leaves the desktop blank.
wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/wallpaper.jpg
    fit_mode = cover
}
