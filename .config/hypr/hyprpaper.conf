# Wallpaper.
#
# The Ventura dark wallpaper from vinceliuice/WhiteSur-wallpapers (MIT), the
# same author as the GTK theme. The amber bloom sits on a near-black navy, so
# the shell's translucent surfaces stay legible over it, and warm against the
# blue system accent reads as complementary rather than competing.
#
# It is square (3840x3840) against a 16:10 panel, so `cover` crops the top and
# bottom heavily. The bloom is centred and survives that; the greyscale
# variants were rejected for being greyscale, not for their aspect.

preload = ~/.config/hypr/wallpapers/ventura-dark.jpg

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/ventura-dark.jpg
    fit_mode = cover
}
