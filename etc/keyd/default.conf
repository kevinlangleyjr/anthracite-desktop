# macOS-style keyboard layer.
#
# On a Mac the bottom row reads  Ctrl | Option | Cmd | Space , and Cmd is the
# application modifier: Cmd+C copies, Cmd+Q quits, Cmd+W closes. Ctrl is left
# almost entirely to the terminal. A PC keyboard reads Ctrl | Super | Alt |
# Space instead, and Linux puts the application modifier on Ctrl.
#
# Hyprland can rebind its own shortcuts but cannot change what a key sends to
# an application, so matching macOS needs this layer underneath.
#
# The mapping:
#   - The key beside the spacebar (physically Alt) becomes Cmd.
#   - The key outside it (physically Super) becomes Option.
#   - Physical Ctrl is left completely alone, so Ctrl+C in a terminal is still
#     SIGINT — exactly as on a Mac.
#
# Cmd acts as Control for applications, which is what makes Cmd+C, Cmd+V,
# Cmd+S and friends work everywhere without per-app configuration. The handful
# of chords the compositor owns are re-emitted as Super instead, so Hyprland
# can bind them without colliding with genuine Ctrl chords typed in a terminal.
#
# Panic: hold backspace + escape + enter together to make keyd exit and hand
# the keyboard back untouched. Worth knowing before enabling the service.

[ids]
*

[main]

# Super position -> Option. Left as a plain Alt so Alt-based chords that apps
# already expect keep working.
leftmeta = layer(option)

# Alt position -> Cmd. This is the key that does the work.
leftalt = layer(cmd)

# The right-hand pair mirrors the left, matching a Mac's right Cmd/Option.
rightalt = layer(cmd)
rightmeta = layer(option)

[option:A]

# Nothing to override — the layer exists so the Super-position key behaves as
# an ordinary Alt rather than a Super.

[cmd:C]

# Everything not listed below falls through as Control, which is the whole
# point: Cmd+C/V/X/A/S/Z/F/T/N/W all reach the application as the Ctrl chord
# it already understands.

# Compositor-owned chords, re-emitted as Super so hyprland.lua can bind them
# unambiguously. Ctrl+Space and Ctrl+Tab stay available to applications.
space = M-space
tab = M-tab
q = M-q
h = M-h
m = M-m
grave = M-grave

[cmd+shift]

# Screenshots. macOS puts these on Cmd+Shift+3/4/5; sending them through as
# Super+Shift keeps them clear of the Ctrl+Shift chords browsers use heavily.
3 = M-S-3
4 = M-S-4
5 = M-S-5

# Cmd+Shift+Tab walks the switcher backwards.
tab = M-S-tab
